<track-card data-trackid="{{ .music_file.pk }}"
            data-remove-from-tag="{{ if .remove_from_tag }}{{ .remove_from_tag }}{{ end }}"
            data-menu-url="{{ call .url "music_file_dropdown" }}"
            data-menu-loading="{{ call .translate_literal "Loading track actions…" }}"
            data-menu-error="{{ call .translate_literal "Unable to load track actions. Close the menu and try again." }}">
    <img class="track-grid-artwork" src="{{ call .artwork_url .music_file.pk 256 .music_file.modified_at }}" alt="" width="256" height="256" loading="lazy" decoding="async" draggable="false">
    <div class="track-card-line track-grid-artist" tabindex="0" title="{{ .music_file.artist }}"><span>{{ .music_file.artist }}</span></div>
    <div class="track-card-line track-grid-title" tabindex="0" title="{{ .music_file.title }}"><span>{{ .music_file.title }}</span></div>
    <div class="track-card-actions">
        <button type="button" class="btn btn-sm btn-primary" data-track-action="listen" title="{{ call .translate_literal "play now" }}" aria-label="{{ call .translate_literal "play now" }}">
            <i class="bi bi-play-fill" aria-hidden="true"></i>
        </button>
        <div class="dropdown">
            <button type="button" class="btn btn-sm btn-outline-secondary track-card-menu" data-bs-toggle="dropdown" aria-expanded="false" title="{{ call .translate_literal "More track actions" }}" aria-label="{{ call .translate_literal "More track actions" }}">
                <i class="bi bi-three-dots" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end dropdown-menu-{{ .music_file.pk }}"></ul>
        </div>
        <form up-target="#alert_space" method="post" action="{{ call .url "add_to_tag" }}">
            <input type="hidden" name="csrfmiddlewaretoken" value="{{ .csrf_token }}">
            <input type="hidden" name="add_type" value="music_file">
            <input type="hidden" name="tag" value="queue">
            <input type="hidden" name="q" value="{{ .music_file.pk }}">
            <button type="submit" class="btn btn-sm btn-outline-secondary" title="{{ call .translate_literal "add to queue" }}" aria-label="{{ call .translate_literal "add to queue" }}">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</track-card>
